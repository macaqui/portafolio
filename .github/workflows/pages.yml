name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos que necesita el flujo para publicar en Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Solo un despliegue a la vez; no cancelar el que esté en curso
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Compilar el portafolio
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar para producción
        run: npm run build

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Subir el resultado (carpeta dist)
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publicar la página
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
